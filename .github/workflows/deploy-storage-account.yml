name: Deploy Storage Account

on:
  pull_request:
    paths:
      - 'storage-account/**'
      - 'modules/**'
      - '.github/workflows/deploy-storage-account.yml'
      - '.github/workflows/_bicep-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'storage-account/**'
      - 'modules/**'
      - '.github/workflows/deploy-storage-account.yml'
      - '.github/workflows/_bicep-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (uses storage-account/parameters/<environment>.bicepparam)'
        type: choice
        options: [dev, prod]
        default: dev
      whatIfOnly:
        description: 'Only preview changes (what-if), do not deploy'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC login to Azure

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment || 'dev' }}-${{ github.event_name == 'pull_request' && github.head_ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  bicep:
    uses: ./.github/workflows/_bicep-deploy.yml
    with:
      template-dir: storage-account
      environment: ${{ inputs.environment || 'dev' }}
      what-if-only: ${{ inputs.whatIfOnly || false }}
    secrets: inherit
