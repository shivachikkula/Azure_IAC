# Standalone App Service template. Pull requests validate it and preview dev; deploy it by running
# this workflow manually (Actions → Deploy App Service → Run workflow). Merging does not deploy it:
# teams request services through projects/ instead.
name: Deploy App Service

on:
  pull_request:
    paths:
      - 'app-service/**'
      - 'modules/**'
      - '.github/workflows/deploy-app-service.yml'
      - '.github/workflows/_bicep-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (uses app-service/parameters/<environment>.bicepparam)'
        type: choice
        options: [dev, prod]
        default: dev
      whatIfOnly:
        description: 'Only preview changes (what-if), do not deploy'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC login to Azure

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment || 'dev' }}-${{ github.event_name == 'pull_request' && github.head_ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  bicep:
    uses: ./.github/workflows/_bicep-deploy.yml
    with:
      template-file: app-service/main.bicep
      parameters-file: app-service/parameters/${{ inputs.environment || 'dev' }}.bicepparam
      environment: ${{ inputs.environment || 'dev' }}
      what-if-only: ${{ inputs.whatIfOnly || false }}
    secrets: inherit
