# Standalone Angular + .NET API template. Pull requests validate it and preview dev; deploy it by running
# this workflow manually (Actions → Deploy Angular + .NET API → Run workflow). Merging does not deploy it:
# teams request services through projects/ instead.
name: Deploy Angular + .NET API

on:
  pull_request:
    paths:
      - 'web-angular-api/**'
      - 'modules/**'
      - '.github/workflows/deploy-web-angular-api.yml'
      - '.github/workflows/_bicep-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (uses web-angular-api/parameters/<environment>.bicepparam)'
        type: choice
        options: [dev, prod]
        default: dev
      whatIfOnly:
        description: 'Only preview changes (what-if), do not deploy'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC login to Azure

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment || 'dev' }}-${{ github.event_name == 'pull_request' && github.head_ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  bicep:
    uses: ./.github/workflows/_bicep-deploy.yml
    with:
      template-file: web-angular-api/main.bicep
      parameters-file: web-angular-api/parameters/${{ inputs.environment || 'dev' }}.bicepparam
      environment: ${{ inputs.environment || 'dev' }}
      what-if-only: ${{ inputs.whatIfOnly || false }}
    secrets: inherit
